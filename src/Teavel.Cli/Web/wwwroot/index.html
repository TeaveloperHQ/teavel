<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teavel — 학교 M365</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>

<!--
  맨 위 줄. 관리 센터의 SuiteHeader 자리다.

  Teavel 이라고 분명히 적는다 — 생김새는 따르되 마이크로소프트의 것인 척하지 않는다.
-->
<div id="suite">
  <span class="app">Teavel</span>
  <span class="where">학교 M365 관리</span>
  <span class="grow"></span>
  <button class="out" id="quit"><span class="i">&#xE7E8;</span> 끝내기</button>
</div>

<!--
  정식 관리 센터를 감추지 않는다. 대신 <b>여기서 하는 일이 아니라는 것</b>만 분명히 해 둔다.
  이 화면의 목적은 학교가 실제로 하는 몇 가지만 남기는 것이고, 나머지가 필요할 때
  어디로 가야 하는지는 알아야 한다.
-->
<div class="msg">
  <span class="i">&#xE946;</span>
  <span class="grow">이 화면에는 <b>학교에서 실제로 하는 일</b>만 담았습니다.
  생김새는 정식 관리 센터를 따랐으니, 거기로 가셔도 낯설지 않으실 겁니다.</span>
  <a href="https://admin.microsoft.com" target="_blank" rel="noreferrer noopener">Microsoft 365 관리 센터 열기 ↗</a>
</div>

<div id="shell">
  <!--
    셋뿐이다 — 구성원 · 팀 · 그룹.
    관리자가 하는 일이 결국 '사람' '팀' '그 밖의 그룹' 셋으로 나뉘고,
    그보다 잘게 나누면 어느 낱장으로 가야 할지부터 정해야 해서 그 자리에서 막힌다.
  -->
  <nav id="side">
    <div class="brand">
      <b>학교 M365</b>
      <span id="school">지금 상태와 할 일</span>
    </div>

    <a class="nav" href="#/한눈에"><span class="i">&#xE80F;</span> 한눈에</a>
    <a class="nav" href="#/구성원"><span class="i">&#xE716;</span> 구성원 <em id="tag-member"></em></a>
    <a class="nav" href="#/팀"><span class="i">&#xE902;</span> 팀 (Teams) <em id="tag-team"></em></a>
    <a class="nav" href="#/그룹"><span class="i">&#xE902;</span> 그룹 <em id="tag-group"></em></a>

    <div class="grow"></div>

    <div class="foot">
      <button id="refresh"><span class="i">&#xE72C;</span> 다시 읽기</button>
    </div>
  </nav>

  <main>
    <!--
      명단은 '단계' 가 아니라 '상태' 다. 구성원·팀 낱장이 전부 여기에 기대므로
      한 낱장 안에 넣어 두면 나머지에서 막힌다. 그래서 늘 보이는 자리에 둔다.
    -->
    <div id="roster-bar">
      <span class="i">&#xE8A5;</span>
      <span id="roster-what">명단을 읽는 중…</span>
      <button id="roster-open" class="tiny">명단 올리기</button>
    </div>

    <div id="page"><div class="loading">읽는 중…</div></div>
  </main>
</div>

<!-- 오래 걸리는 일이 돌 때만 올라온다. 화면이 멈춘 것처럼 보이면 관리자가 창을 닫는다. -->
<div id="drawer" hidden>
  <div id="drawer-grip" title="끌어서 높이를 바꾸실 수 있습니다"></div>
  <div id="drawer-head">
    <b id="drawer-title"></b>
    <span id="drawer-state">돌고 있습니다…</span>
    <button id="drawer-close" hidden>닫기</button>
  </div>
  <div id="drawer-lines"></div>
</div>

<div id="toast" hidden></div>

<script src="/app.js"></script>
</body>
</html>
